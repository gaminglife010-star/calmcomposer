name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --windowed --name CalmComposer app.py
      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalmComposer-windows
          path: dist/CalmComposer.exe
